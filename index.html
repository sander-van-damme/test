<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1117;color:#e6edf3}.wrap{text-align:center;padding:20px}h1{margin:0 0 8px}p{color:#9da7b3}canvas{background:#161b22;border:2px solid #30363d;border-radius:10px;max-width:90vw;touch-action:none}button{border:0;border-radius:8px;padding:12px 20px;background:#3fb950;color:#07120a;font-weight:bold;cursor:pointer}.controls{display:grid;grid-template-columns:repeat(3,52px);gap:6px;justify-content:center;margin-top:14px}.controls button{padding:12px}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3;grid-row:2}
</style></head><body><main class="wrap"><h1>🐍 Snake</h1><p>Score: <strong id="score">0</strong> · Best: <strong id="best">0</strong></p><canvas id="game" width="400" height="400" aria-label="Snake game"></canvas><p id="status" aria-live="polite">Press Start to play</p><button id="start">Start / Restart</button><p>Arrow keys or WASD · Swipe or use buttons on mobile</p><div class="controls"><button class="up" data-dir="up">↑</button><button class="left" data-dir="left">←</button><button class="down" data-dir="down">↓</button><button class="right" data-dir="right">→</button></div></main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status');
const N=20,S=20;let snake,food,dir,nextDir,score,timer=null,running=false;
let best=Number(localStorage.getItem('snake-best')||0);bestEl.textContent=best;
function spawn(){const free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(p=>p.x===x&&p.y===y))free.push({x,y});return free.length?free[Math.floor(Math.random()*free.length)]:null}
function draw(){ctx.fillStyle='#161b22';ctx.fillRect(0,0,400,400);ctx.strokeStyle='#202a32';for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,400);ctx.moveTo(0,i*S);ctx.lineTo(400,i*S);ctx.stroke()}if(food){ctx.fillStyle='#f85149';ctx.beginPath();ctx.arc((food.x+.5)*S,(food.y+.5)*S,7,0,Math.PI*2);ctx.fill()}snake.forEach((p,i)=>{ctx.fillStyle=i?'#3fb950':'#7ee787';ctx.fillRect(p.x*S+2,p.y*S+2,S-4,S-4)})}
function end(msg){running=false;clearInterval(timer);timer=null;statusEl.textContent=msg+' — press Start to play again'}
function tick(){dir=nextDir;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eats=food&&h.x===food.x&&h.y===food.y;const body=eats?snake:snake.slice(0,-1);if(h.x<0||h.x>=N||h.y<0||h.y>=N||body.some(p=>p.x===h.x&&p.y===h.y)){end('Game over');return}snake.unshift(h);if(eats){score++;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('snake-best',best)}food=spawn();if(!food){draw();end('You win!');return}}else snake.pop();draw()}
function start(){clearInterval(timer);snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir=dir;score=0;scoreEl.textContent=0;food=spawn();running=true;statusEl.textContent='Playing';draw();timer=setInterval(tick,125)}
function turn(name){const d={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[name];if(running&&d&&!(d.x===-dir.x&&d.y===-dir.y))nextDir=d}
document.getElementById('start').addEventListener('click',start);document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>turn(b.dataset.dir)));
document.addEventListener('keydown',e=>{const name={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];if(name){e.preventDefault();turn(name)}});
let touch=null;canvas.addEventListener('touchstart',e=>{touch={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});canvas.addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.max(Math.abs(dx),Math.abs(dy))>20)turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));touch=null});snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];food={x:14,y:10};draw();
</script></body></html>
